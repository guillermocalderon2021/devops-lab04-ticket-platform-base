name: Format Terraform baseline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-lockfiles.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5

      - name: Formatear Terraform
        run: terraform -chdir=terraform fmt -recursive

      - name: Versionar formato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terraform
          if git diff --cached --quiet; then
            echo "Terraform ya estaba formateado."
            exit 0
          fi
          git commit -m "Format Terraform baseline"
          git push
