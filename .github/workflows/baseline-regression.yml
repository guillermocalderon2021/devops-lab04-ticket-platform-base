name: Baseline regression validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/baseline-regression.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5

      - name: Validate shell scripts
        run: bash -n scripts/*.sh

      - name: API dependencies
        working-directory: api
        run: npm ci

      - name: API lint
        working-directory: api
        run: npm run lint

      - name: API tests
        working-directory: api
        run: npm test

      - name: API build
        working-directory: api
        run: npm run build

      - name: API Docker build
        working-directory: api
        run: docker build -t ticket-api:regression .

      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Frontend Docker build
        working-directory: frontend
        run: docker build -t ticket-frontend:regression .

      - name: Terraform format
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform init
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform -chdir=terraform validate
